name: Secret Scan

on:
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.sh'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - '**/*.md'
      - 'scripts/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan-local:
    name: secret-scan-local
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Fetch base branch for changed diff
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Run changed-file secret scan (strict)
        run: |
          mkdir -p artifacts/secret-scan-local
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            php scripts/secret_scan.php \
              --changed \
              --strict \
              --base "origin/${{ github.base_ref || 'main' }}" \
              --head HEAD \
              --fix \
              --output artifacts/secret-scan-local/findings.json \
              --telemetry artifacts/secret-scan-local/telemetry.json
          else
            php scripts/secret_scan.php \
              --strict \
              --fix \
              --output artifacts/secret-scan-local/findings.json \
              --telemetry artifacts/secret-scan-local/telemetry.json
          fi

      - name: Upload local scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-local-artifacts
          path: artifacts/secret-scan-local
          if-no-files-found: warn

  secret-preflight-ci:
    name: secret-preflight-ci
    runs-on: ubuntu-latest
    env:
      KH_SMMA_TEST_MODE: ci
      KH_SMMA_GOLDEN_FIXTURE: generate_awareness_ok.json
      OPENAI_API_KEY: ''
      OPENAI_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_KEY: ''
      DUAL_GPT_API_KEY: ''
      LLM_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run secret preflight (CI profile)
        run: |
          mkdir -p artifacts/secret-preflight-ci
          php scripts/secret_preflight.php \
            --profile cic-ci \
            --output artifacts/secret-preflight-ci/preflight.json

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-preflight-ci-artifacts
          path: artifacts/secret-preflight-ci
          if-no-files-found: warn

  secret-scan-full:
    name: secret-scan-full
    runs-on: ubuntu-latest
    needs: [secret-scan-local, secret-preflight-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run full-repo secret scan (strict)
        run: |
          mkdir -p artifacts/secret-scan-full
          php scripts/secret_scan.php \
            --strict \
            --fix \
            --output artifacts/secret-scan-full/findings.json \
            --telemetry artifacts/secret-scan-full/telemetry.json

      - name: Upload full scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-full-artifacts
          path: artifacts/secret-scan-full
          if-no-files-found: warn

  secret-preflight-runtime:
    name: secret-preflight-runtime
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      KH_STRIPE_SECRET_KEY: ${{ secrets.KH_STRIPE_SECRET_KEY }}
      KH_STRIPE_WEBHOOK_SECRET: ${{ secrets.KH_STRIPE_WEBHOOK_SECRET }}
      KHM_ANON_SALT: ${{ secrets.KHM_ANON_SALT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate runtime secret injection (example gate)
        run: |
          mkdir -p artifacts/secret-preflight
          php scripts/secret_preflight.php \
            --required KH_STRIPE_SECRET_KEY,KH_STRIPE_WEBHOOK_SECRET,KHM_ANON_SALT \
            --output artifacts/secret-preflight/runtime-preflight.json

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-preflight-artifacts
          path: artifacts/secret-preflight
          if-no-files-found: warn
