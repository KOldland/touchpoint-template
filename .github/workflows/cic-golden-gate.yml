name: CIC Golden Gate

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'app/public/wp-content/plugins/kh-smma/tests/fixtures/golden/**'
      - 'scripts/**'
      - 'docs/contracts/**'
      - '.github/workflows/cic-golden-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run secret scan
        run: php scripts/secret_scan.php

  golden-check:
    name: golden-check
    runs-on: ubuntu-latest
    needs: [secret-scan]
    env:
      KH_SMMA_TEST_MODE: ci
      CI: 'true'
      OPENAI_API_KEY: ''
      OPENAI_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_KEY: ''
      DUAL_GPT_API_KEY: ''
      LLM_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install plugin dependencies (retry wrapper)
        run: |
          php scripts/ci_retry_wrapper.php --retries 2 --delay-ms 500 --command "cd app/public/wp-content/plugins/kh-smma && composer install --prefer-dist --no-progress --no-interaction"

      - name: Verify fixture metadata + checksums
        run: php scripts/verify_golden_fixtures.php

      - name: Enforce owner label for fixture/contract changes
        run: |
          php scripts/label_check.php \
            --event "$GITHUB_EVENT_PATH" \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --head HEAD

      - name: Run fast smoke golden check
        id: golden_fast
        run: |
          mkdir -p artifacts/golden-fast
          php scripts/golden_check.php \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --head HEAD \
            --fixtures "generate_awareness_ok.json,compliance_ok.json" \
            --output artifacts/golden-fast/golden-summary.json \
            --diff-dir artifacts/golden-fast/diffs \
            --zip artifacts/golden-fast/golden-diff.zip

      - name: Render HTML diff preview
        if: always()
        run: |
          python3 scripts/extract_golden_diffs.py artifacts/golden-fast/golden-diff.zip --out artifacts/golden-fast/golden-diff.html || true

      - name: Upload fast golden artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-fast-artifacts
          path: artifacts/golden-fast
          if-no-files-found: warn

      - name: Post mismatch summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'artifacts/golden-fast/golden-summary.json';
            let body = '**Golden-check (fast) failed**\n\n';
            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const mismatches = summary.mismatches || [];
              body += `Result: ${summary.result}\n\n`;
              if (mismatches.length > 0) {
                body += mismatches.map(m => `- ${m.fixture || m.stage} (owner: ${m.owner || '@unknown'})`).join('\n');
                body += '\n\nSee artifact: golden-fast-artifacts (includes HTML diff preview).';
              } else {
                body += 'No mismatches listed in summary JSON.';
              }
            } else {
              body += 'No summary found. Check workflow logs.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  golden-check-full:
    name: golden-check-full
    runs-on: ubuntu-latest
    needs: [golden-check]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      KH_SMMA_TEST_MODE: ci
      CI: 'true'
      OPENAI_API_KEY: ''
      OPENAI_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_KEY: ''
      DUAL_GPT_API_KEY: ''
      LLM_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install plugin dependencies
        run: |
          php scripts/ci_retry_wrapper.php --retries 2 --delay-ms 500 --command "cd app/public/wp-content/plugins/kh-smma && composer install --prefer-dist --no-progress --no-interaction"

      - name: Run full golden check
        run: |
          mkdir -p artifacts/golden-full
          php scripts/golden_check.php \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --head HEAD \
            --fixtures "generate_awareness_ok.json,generate_sponsor_warn.json,generate_sponsor_fail.json,google_ad_draft.json,compliance_ok.json,compliance_warn.json,compliance_fail.json,checkout_session_completed.json,invoice_paid.json,checkout_session_no_consent.json,paid_adapter_dry_run_manifest.json,paid_adapter_execute_response.json" \
            --output artifacts/golden-full/golden-summary.json \
            --diff-dir artifacts/golden-full/diffs \
            --zip artifacts/golden-full/golden-diff.zip

      - name: Render HTML diff preview
        if: always()
        run: |
          python3 scripts/extract_golden_diffs.py artifacts/golden-full/golden-diff.zip --out artifacts/golden-full/golden-diff.html || true

      - name: Upload full golden artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-full-artifacts
          path: artifacts/golden-full
          if-no-files-found: warn
